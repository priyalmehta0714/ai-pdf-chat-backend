version: "3.9"

services:
  backend:
    build: .

    container_name: ai-pdf-backend

    ports:
      - "5000:5000"

    depends_on:
      - postgres

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_pdf_chat
      OPENAI_API_KEY: ${OPENAI_API_KEY}

  postgres:
    image: pgvector/pgvector:pg16

    container_name: ai-pdf-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_pdf_chat

    ports:
      - "5432:5432"

volumes:
  postgres_data: